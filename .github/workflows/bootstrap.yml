name: Bootstrap dependencies
on:
  push:
    branches: [feat/mvp-agent-workspace]
    paths: [package.json, components.json, .github/workflows/bootstrap.yml]
permissions:
  contents: write
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/feat/mvp-agent-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies
        run: npm install --no-audit --no-fund
      - name: Install selected official UI components
        run: |
          npx shadcn@latest add button input badge --yes
          npx shadcn@latest add https://elements.ai-sdk.dev/api/registry/message.json --yes
      - name: Typecheck foundation
        run: npm run typecheck
      - name: Build foundation
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Publish generated sources and dependency lock atomically
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const branch = 'feat/mvp-agent-workspace';
            const {data: ref} = await github.rest.git.getRef({...context.repo,ref:`heads/${branch}`});
            if (ref.object.sha !== context.sha) throw new Error('Branch changed; refusing stale generated-file publication');
            const paths = [...new Set(cp.execFileSync('git',['ls-files','--modified','--others','--exclude-standard'],{encoding:'utf8'}).trim().split('\n').filter(Boolean))];
            const allowed = p => ['package.json','package-lock.json','src/app/globals.css','src/lib/utils.ts','next-env.d.ts'].includes(p) || p.startsWith('src/components/ui/') || p.startsWith('src/components/ai-elements/') || p.startsWith('src/hooks/');
            if(paths.some(p=>!allowed(p))) throw new Error('Unexpected generated paths: '+paths.filter(p=>!allowed(p)).join(','));
            const {data: parent} = await github.rest.git.getCommit({...context.repo,commit_sha:context.sha});
            const entries=paths.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}));
            const {data: tree}=await github.rest.git.createTree({...context.repo,base_tree:parent.tree.sha,tree:entries});
            if(tree.sha===parent.tree.sha) return;
            const {data: commit}=await github.rest.git.createCommit({...context.repo,message:'chore: install official UI primitives and lock dependencies',tree:tree.sha,parents:[context.sha]});
            await github.rest.git.updateRef({...context.repo,ref:`heads/${branch}`,sha:commit.sha,force:false});
            core.notice('Published verified foundation tree: '+commit.sha);
